<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevate – Design Your Boat Lift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Tesla exact palette */
  --white:           #FFFFFF;
  --bg:              #FFFFFF;
  --bg-media:        #F5F5F5;
  --text-primary:    #171A20;
  --text-secondary:  #5C5E62;
  --text-tertiary:   #878A8F;
  --border:          #D0D1D2;
  --border-hover:    #BABCBE;
  --blue:            #3E6AE1;
  --blue-light:      rgba(62, 106, 225, 0.06);
  --divider:         #E8E8E8;
  --bar-shadow:      rgba(0, 0, 0, 0.08);
}

html {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  color: var(--text-primary);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px;
  line-height: 1.4;
}

body { min-height: 100vh; }

/* ─── Top Nav ─── */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 200;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  border-bottom: 1px solid var(--divider);
}

.top-nav-inner {
  width: 100%;
  max-width: 1440px;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-primary);
  text-decoration: none;
  letter-spacing: -0.2px;
}

.nav-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 32px;
}

.nav-center a {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  padding: 4px 0;
  transition: color 0.15s;
}

.nav-center a:hover { color: var(--text-primary); }
.nav-center a.active { color: var(--text-primary); }

.nav-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-right a {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
}

.nav-right a:hover { color: var(--text-primary); }

/* ─── Main Split ─── */
.main {
  display: grid;
  grid-template-columns: 58fr 42fr;
  min-height: calc(100vh - 52px);
}

/* ─── Media Panel (left, blank) ─── */
.media-panel {
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  background: var(--bg-media);
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--divider);
  overflow: hidden;
}

.media-image {
  max-width: 70%;
  max-height: 80%;
  object-fit: contain;
  opacity: 0;
  transform: scale(0.96);
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.media-image.visible {
  opacity: 1;
  transform: scale(1);
}

/* ─── Config Panel (right) ─── */
.config-panel {
  padding: 40px 48px 120px;
  overflow-y: auto;
  max-height: calc(100vh - 52px);
}

/* Title area */
.config-title {
  font-size: 28px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.4px;
}

.config-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.config-price-hero {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 12px;
}

.config-price-hero span {
  color: var(--text-primary);
  font-weight: 500;
}

.config-divider {
  height: 1px;
  background: var(--divider);
  margin: 32px 0;
}

/* ─── Section ─── */
.section { margin-bottom: 40px; }
.section:last-child { margin-bottom: 0; }

.section-header {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.section-note {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}

.section-header:last-of-type:not(:has(+ .section-note)) {
  margin-bottom: 16px;
}

.section:not(:has(.section-note)) .section-header {
  margin-bottom: 16px;
}

/* ─── Option Cards (Model, Motor) ─── */
.option-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.option-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}

.option-card:hover { border-color: var(--border-hover); }

.option-card.selected {
  border-color: var(--blue);
  border-width: 2px;
  padding: 15px 19px;
  background: var(--blue-light);
}

/* Radio circle */
.radio {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.15s;
}

.option-card.selected .radio { border-color: var(--blue); }

.radio-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--blue);
  opacity: 0;
  transform: scale(0);
  transition: all 0.15s;
}

.option-card.selected .radio-dot {
  opacity: 1;
  transform: scale(1);
}

.option-text { flex: 1; }

.option-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}

.option-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.option-price {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.option-card.selected .option-price { color: var(--text-primary); }

/* ─── Motor Grid ─── */
.motor-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.motor-card {
  padding: 20px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}

.motor-card:hover { border-color: var(--border-hover); }

.motor-card.selected {
  border-color: var(--blue);
  border-width: 2px;
  padding: 19px 15px;
  background: var(--blue-light);
}

.motor-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.motor-spec {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
}

.motor-price {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-top: 10px;
}

.motor-card.selected .motor-price { color: var(--text-primary); }

/* ─── Paint / Finish Swatches ─── */
.swatch-row {
  display: flex;
  gap: 16px;
  align-items: center;
}

.swatch-btn {
  position: relative;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  transition: transform 0.15s;
  outline: none;
}

.swatch-btn:hover { transform: scale(1.08); }

/* Outer ring on selection */
.swatch-btn::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid transparent;
  transition: border-color 0.15s;
  pointer-events: none;
}

.swatch-btn.selected::after {
  border-color: var(--blue);
}

/* Dark swatch gets a visible border */
.swatch-btn.dark-swatch {
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
}

.swatch-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
}

.swatch-label-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}

.swatch-label-price {
  font-size: 14px;
  color: var(--text-secondary);
}

/* ─── Accessories (checkbox cards) ─── */
.acc-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.acc-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}

.acc-card:hover { border-color: var(--border-hover); }

.acc-card.selected {
  border-color: var(--blue);
  border-width: 2px;
  padding: 15px 19px;
  background: var(--blue-light);
}

.acc-text { flex: 1; }

.acc-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}

.acc-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.acc-price {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.acc-card.selected .acc-price { color: var(--text-primary); }

.cbox {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}

.acc-card.selected .cbox {
  background: var(--blue);
  border-color: var(--blue);
}

.cbox svg {
  width: 12px;
  height: 12px;
  color: #fff;
  opacity: 0;
  transition: opacity 0.12s;
}

.acc-card.selected .cbox svg { opacity: 1; }

/* ─── Sticky Bottom Bar ─── */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  height: 72px;
  background: var(--white);
  border-top: 1px solid var(--divider);
  box-shadow: 0 -4px 20px var(--bar-shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
}

.bar-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.bar-price {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.3px;
  transition: all 0.25s ease;
}

.bar-label {
  font-size: 13px;
  color: var(--text-tertiary);
}

.bar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-outline {
  padding: 10px 24px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
  background: transparent;
  color: var(--text-primary);
  border: none;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-outline:hover { background: rgba(0,0,0,0.05); }

.btn-blue {
  padding: 10px 24px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
  background: var(--blue);
  color: #fff;
  border: none;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-blue:hover { background: #3560CC; }

/* ─── Mobile ─── */
@media (max-width: 1024px) {
  .main { grid-template-columns: 1fr; }

  .media-panel {
    position: relative;
    top: 0;
    height: 50vw;
    min-height: 240px;
    max-height: 400px;
    border-right: none;
    border-bottom: 1px solid var(--divider);
  }

  .config-panel {
    padding: 28px 20px 120px;
    max-height: none;
  }

  .config-title { font-size: 24px; }
  .motor-grid { grid-template-columns: 1fr; }
  .swatch-row { flex-wrap: wrap; }
  .nav-center { display: none; }
  .bottom-bar { padding: 0 20px; }
}
</style>
</head>
<body>

<!-- ── Top Nav ── -->
<nav class="top-nav">
  <div class="top-nav-inner">
    <a href="#" class="nav-logo">Elevate</a>
    <div class="nav-center">
      <a href="#" class="active">Design</a>
      <a href="#">Features</a>
      <a href="#">Specs</a>
      <a href="#">FAQ</a>
    </div>
    <div class="nav-right">
      <a href="#">Find a Dealer</a>
    </div>
  </div>
</nav>

<!-- ── Main ── -->
<main class="main">

  <!-- Left: Media -->
  <section class="media-panel" id="mediaPanel">
    <img id="mediaImage" src="wristband.png" alt="Transmitter Wristband" class="media-image">
  </section>

  <!-- Right: Config -->
  <div class="config-panel" id="configPanel">

    <h1 class="config-title" id="cfgTitle">Elevate Mono</h1>
    <p class="config-subtitle" id="cfgSubtitle">Remote control system for single motor operated lift</p>
    <p class="config-price-hero">Est. Price: <span id="cfgHeroPrice">$599</span></p>

    <div class="config-divider"></div>

    <!-- Model -->
    <div class="section">
      <h2 class="section-header">Model</h2>
      <div class="option-list" id="modelList"></div>
    </div>

    <!-- Limit Switch (S models only) -->
    <div id="limitSwitchSection" style="display:none">
      <div class="config-divider"></div>
      <div class="section">
        <h2 class="section-header">Limit Switch</h2>
        <p class="section-note">Required for operation</p>
        <div class="motor-grid" id="limitGrid"></div>
      </div>
    </div>

    <div class="config-divider"></div>

    <!-- App Membership -->
    <div class="section">
      <h2 class="section-header">App Membership</h2>
      <div class="motor-grid" id="motorGrid"></div>
    </div>

    <div class="config-divider"></div>

    <!-- Finish -->
    <div class="section">
      <h2 class="section-header">Transmitter Wristband</h2>
      <div class="swatch-row" id="swatchRow"></div>
      <div class="swatch-label">
        <span class="swatch-label-name" id="finishName">Galvanized</span>
        <span class="swatch-label-price" id="finishPrice">Included</span>
      </div>
    </div>

    <div class="config-divider"></div>

    <!-- Accessories -->
    <div class="section">
      <h2 class="section-header">Accessories</h2>
      <div class="acc-list" id="accList"></div>
    </div>

  </div>
</main>

<!-- ── Bottom Bar ── -->
<div class="bottom-bar">
  <div class="bar-left">
    <span class="bar-price" id="totalPrice">$728.99</span>
    <span class="bar-label">Est. Purchase Price</span>
  </div>
  <div class="bar-right">
    <button class="btn-outline">Save Configuration</button>
    <button class="btn-blue">Order Now</button>
  </div>
</div>

<script>
// ── Data ──

const models = [
  { id: 'mono',   name: 'Elevate Mono',   desc: 'Remote control system for single motor operated lift',                          price: 599 },
  { id: 'mono-s', name: 'Elevate Mono S', desc: 'Remote control system for single motor operated lift with auto stop capability', price: 615 },
  { id: 'duo',    name: 'Elevate Duo',    desc: 'Remote control system for two motor operated lift',                              price: 625 },
  { id: 'duo-s',  name: 'Elevate Duo S',  desc: 'Remote control system for two motor operated lift with auto stop capabilities',  price: 645 },
];

const motors = [
  { id: '1year',    name: '1 Year',    spec: 'Recurring annually', delta: 12999 },
  { id: '3year',    name: '3 Years',   spec: 'Recurring every 3 years', delta: 32999 },
  { id: 'lifetime', name: 'Lifetime',  spec: 'Exclusive to launch', delta: 69999 },
];

const finishes = [
  { id: 'galvanized', name: 'Galvanized',     color: '#9CA3AF', dark: false, delta: 0   },
  { id: 'white',      name: 'Arctic White',   color: '#EAECEE', dark: false, delta: 450 },
  { id: 'black',      name: 'Midnight Black', color: '#1F2937', dark: true,  delta: 450 },
  { id: 'navy',       name: 'Nautical Blue',  color: '#1E3A5F', dark: true,  delta: 550 },
  { id: 'bronze',     name: 'Bronze',         color: '#8B6914', dark: false, delta: 550 },
];

const limitSwitches = [
  { id: 'rotary',    name: 'Rotary',     price: 299 },
  { id: 'flatplate', name: 'Flat Plate', price: 325 },
  { id: 'kels',      name: 'Kels',       price: 325 },
];

const accessories = [
  { id: 'led',    name: 'Underwater LED Kit', sub: 'RGBW multi-color, app-controlled',    price: 475 },
  { id: 'cover',  name: 'Remote Cover',       sub: 'Silicone cover to protect keypad',    price: 45.99 },
];

// ── State ──

const state = {
  model: 'mono',
  motor: 'standard',
  finish: 'galvanized',
  limitSwitch: 'rotary',
  acc: new Set(),
};

function isS() { return state.model === 'mono-s' || state.model === 'duo-s'; }

function total() {
  const m = models.find(x => x.id === state.model);
  const mo = motors.find(x => x.id === state.motor);
  const f  = finishes.find(x => x.id === state.finish);
  let t = m.price * 100 + mo.delta + f.delta * 100;
  if (isS()) {
    const ls = limitSwitches.find(x => x.id === state.limitSwitch);
    t += ls.price * 100;
  }
  for (const a of accessories) if (state.acc.has(a.id)) t += Math.round(a.price * 100);
  return t;
}

function fmt(n) { return '$' + n.toLocaleString('en-US'); }
function fmtCents(n) { return '$' + (n / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function delta(n) { return n === 0 ? 'Included' : '+' + fmt(n); }

// ── Render ──

function render() {
  const cm = models.find(x => x.id === state.model);

  // Title area
  document.getElementById('cfgTitle').textContent = cm.name;
  document.getElementById('cfgSubtitle').textContent = cm.desc;
  document.getElementById('cfgHeroPrice').textContent = fmt(cm.price);

  // Models
  document.getElementById('modelList').innerHTML = models.map(m => `
    <div class="option-card${state.model === m.id ? ' selected' : ''}" data-model="${m.id}">
      <div class="radio"><div class="radio-dot"></div></div>
      <div class="option-text">
        <div class="option-name">${m.name}</div>
        <div class="option-desc">${m.desc}</div>
      </div>
      <div class="option-price">${fmt(m.price)}</div>
    </div>
  `).join('');

  // Limit Switch (S models only)
  const lsSection = document.getElementById('limitSwitchSection');
  if (isS()) {
    lsSection.style.display = '';
    document.getElementById('limitGrid').innerHTML = limitSwitches.map(ls => `
      <div class="motor-card${state.limitSwitch === ls.id ? ' selected' : ''}" data-limit="${ls.id}">
        <div class="motor-name">${ls.name}</div>
        <div class="motor-price">${fmt(ls.price)}</div>
      </div>
    `).join('');
  } else {
    lsSection.style.display = 'none';
  }

  // Memberships
  document.getElementById('motorGrid').innerHTML = motors.map(m => `
    <div class="motor-card${state.motor === m.id ? ' selected' : ''}" data-motor="${m.id}">
      <div class="motor-name">${m.name}</div>
      <div class="motor-spec">${m.spec}</div>
      <div class="motor-price">${fmtCents(m.delta)}</div>
    </div>
  `).join('');

  // Finishes
  document.getElementById('swatchRow').innerHTML = finishes.map(f => `
    <button class="swatch-btn${state.finish === f.id ? ' selected' : ''}${f.dark ? ' dark-swatch' : ''}"
            data-finish="${f.id}"
            style="background:${f.color}"
            title="${f.name}"></button>
  `).join('');

  const sf = finishes.find(f => f.id === state.finish);
  document.getElementById('finishName').textContent = sf.name;
  document.getElementById('finishPrice').textContent = delta(sf.delta);

  // Show wristband image in media panel when a color is selected
  const img = document.getElementById('mediaImage');
  if (state.finish) {
    img.classList.add('visible');
  } else {
    img.classList.remove('visible');
  }

  // Accessories
  document.getElementById('accList').innerHTML = accessories.map(a => `
    <div class="acc-card${state.acc.has(a.id) ? ' selected' : ''}" data-acc="${a.id}">
      <div class="cbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="acc-text">
        <div class="acc-name">${a.name}</div>
        <div class="acc-sub">${a.sub}</div>
      </div>
      <div class="acc-price">+${a.price % 1 === 0 ? fmt(a.price) : fmtCents(a.price * 100)}</div>
    </div>
  `).join('');

  // Bottom bar
  document.getElementById('totalPrice').textContent = fmtCents(total());
}

// ── Events ──

document.addEventListener('click', e => {
  const mc = e.target.closest('[data-model]');
  if (mc) { state.model = mc.dataset.model; render(); return; }

  const ls = e.target.closest('[data-limit]');
  if (ls) { state.limitSwitch = ls.dataset.limit; render(); return; }

  const mo = e.target.closest('[data-motor]');
  if (mo) { state.motor = mo.dataset.motor; render(); return; }

  const sw = e.target.closest('[data-finish]');
  if (sw) { state.finish = sw.dataset.finish; render(); return; }

  const ac = e.target.closest('[data-acc]');
  if (ac) {
    const id = ac.dataset.acc;
    state.acc.has(id) ? state.acc.delete(id) : state.acc.add(id);
    render();
  }
});

render();
</script>
</body>
</html>
